# ============================================
# DOCKER COMPOSE - Production ULTRA-LIGHT
# Optimisé pour serveur 512 MB RAM
# ============================================

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sen-logistique-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sen-logistique-network
    command: >
      postgres
      -c shared_buffers=16MB
      -c effective_cache_size=32MB
      -c max_connections=10
      -c work_mem=1MB
    deploy:
      resources:
        limits:
          memory: 80M
        reservations:
          memory: 50M

  app:
    image: sen-logistique:${APP_VERSION:-latest}
    container_name: sen-logistique-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}
      # ⚡ Configuration ULTRA-LIGHT pour 512 MB RAM
      JAVA_OPTS: "-Xms64m -Xmx180m -XX:MaxMetaspaceSize=80m -XX:+UseSerialGC -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -Djava.security.egd=file:/dev/./urandom"
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    # ⚠️ HEALTH CHECK DÉSACTIVÉ pour économiser RAM
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/actuator/health || exit 1"]
    #   interval: 30s
    #   timeout: 10s
    #   retries: 3
    #   start_period: 60s
    networks:
      - sen-logistique-network
    deploy:
      resources:
        limits:
          memory: 250M
        reservations:
          memory: 150M

networks:
  sen-logistique-network:
    driver: bridge
    name: sen-logistique-network
