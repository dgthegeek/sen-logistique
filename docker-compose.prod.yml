version: '3.8'

services:
  # ==========================================
  # BASE DE DONNÉES POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: sen-logistique-db
    restart: unless-stopped
    
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    
    ports:
      - "127.0.0.1:5432:5432"
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - sen-logistique-network
    
    # Configuration PostgreSQL normale pour 8GB RAM
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c max_connections=100
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c max_wal_size=1GB
      -c min_wal_size=80MB
    
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

  # ==========================================
  # APPLICATION SPRING BOOT
  # ==========================================
  app:
    image: sen-logistique:${APP_VERSION:-latest}
    container_name: sen-logistique-app
    restart: unless-stopped
    
    depends_on:
      postgres:
        condition: service_healthy
    
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-false}

      # Notifications Telegram — un seul bot pour toute la plateforme.
      # Renseigner ces 3 valeurs dans le .env du VPS puis redéployer.
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}

      # ⚡ JVM NORMAL pour 8 GB RAM - Fini les OutOfMemoryError!
      JAVA_OPTS: >-
        -Xms512m
        -Xmx1536m
        -XX:MaxMetaspaceSize=512m
        -XX:MetaspaceSize=256m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:ParallelGCThreads=2
        -XX:ConcGCThreads=1
        -XX:InitiatingHeapOccupancyPercent=70
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.jmx.enabled=true
    
    ports:
      - "127.0.0.1:8080:8080"
    
    volumes:
      - ./logs:/app/logs
    
    networks:
      - sen-logistique-network
    
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

networks:
  sen-logistique-network:
    driver: bridge
    name: sen-logistique-network
