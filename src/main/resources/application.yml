spring:
  application:
    name: logistique-dakar
  
  # Configuration Base de données
  datasource:
    url: jdbc:postgresql://localhost:5432/logistique_dakar
    username: logistique_user
    password: logistique2024
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
    open-in-view: false
  
  # Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  # Jackson
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: Africa/Dakar
  
  # Server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false

# Configuration JWT
jwt:
  secret: ${JWT_SECRET:votreSecretSuperSecretQuiDoitEtreTresLongEtComplexePourLaSecurite2024}
  expiration: 86400000 # 24 heures en millisecondes
  refresh-expiration: 604800000 # 7 jours

# Configuration Application
app:
  base-url: ${APP_BASE_URL:https://app.dioks.com}
  tracking-url: ${TRACKING_URL:https://app.dioks.com/tracking}
  
  # Numérotation des colis
  tracking:
    prefix: DKR
    start-number: 1
  
  # Commission plateforme
  commission:
    percentage: 40 # 40% pour la plateforme, 60% pour le livreur
  
  # Tarifs supplémentaires poids
  tarifs:
    supplement-poids-5kg: 500 # +500 FCFA si poids > 5kg
    supplement-poids-10kg: 1000 # +1000 FCFA si poids > 10kg
  
  # CORS

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.dioks.com}

# Notifications Telegram (bot). Désactivé tant que le token n'est pas fourni.
telegram:
  enabled: ${TELEGRAM_ENABLED:false}
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  bot-username: ${TELEGRAM_BOT_USERNAME:}

# Logging
logging:
  level:
    root: INFO
    sn.votreplateforme: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    disable-swagger-default-url: true
  show-actuator: false

# Actuator (monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
# Profil Développement
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    sn.votreplateforme: DEBUG
    org.springframework.web: DEBUG

app:
  base-url: http://localhost:8080
  tracking-url: http://localhost:4200/tracking

---
