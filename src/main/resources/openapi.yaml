        - NOUVELLE
        - A_APPELER
        - CONFIRMEE
        - PRETE_A_LIVRER
        - ASSIGNEE
        - EN_LIVRAISON
        - LIVREE
        - ECHEC
        - ANNULEE
        # Ancien cycle (module ramassage - dormant, conservé pour l'historique)
        - EN_ATTENTE_RAMASSAGE
        - RAMASSE
        - EN_ROUTE
        - ECHEC_ABSENT
        - ECHEC_REFUSE

