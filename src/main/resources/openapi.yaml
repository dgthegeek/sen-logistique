            nom:
              type: string
              example: "Aïssatou Ndiaye"
            telephone:
              type: string
              example: "772345678"
            adresse:
              type: string
              example: "Mermoz, Cité Biagui, Villa 45"
            pointRepere:
              type: string
              example: "Face à la mosquée"
        produit:
          type: object
          properties:
            description:
              type: string
              example: "Ensemble wax"
            fragile:
              type: boolean
        vendeur:
          type: object
          properties:
            nom:
              type: string
              example: "Fatou"
        montantACollecter:
          type: number
          format: decimal
          example: 35000

    ConfirmLivraisonRequest:
      type: object
      required:
        - cashCollecte
        - colisRemis
      properties:
        cashCollecte:
          type: number
          format: decimal
          example: 35000
        colisRemis:
          type: boolean
          example: true
        commentaire:
          type: string
          example: "Livraison OK, cliente satisfaite"

    # ============================================
    # TRACKING SCHEMA
    # ============================================
    TrackingResponse:
      type: object
      properties:
        numeroTracking:
          type: string
          example: "DKR-00567"
        statut:
          $ref: '#/components/schemas/StatutLivraison'
        destination:
          type: string
          example: "Mermoz"
        montantAPayer:
          type: number
          format: decimal
          example: 35000
        timeline:
          type: array
          items:
            type: object
            properties:
              etape:
                type: string
                enum: [COMMANDE_CREEE, COLIS_RECUPERE, EN_COURS_LIVRAISON, LIVRE]
              date:
                type: string
                format: date-time
              effectue:
                type: boolean

    # ============================================
    # ZONE SCHEMAS
    # ============================================
    Zone:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nom:
          type: string
          example: "Zone 2 - Sacré-Coeur, Mermoz"
        description:
          type: string
        communes: # ✅ AJOUTER CE CHAMP
          type: array
          items:
            type: string
          example: [ "Dakar", "Plateau", "Médina" ]
        tarifStandard:
          type: number
          format: decimal
          example: 1500
        tarifExpress:
          type: number
          format: decimal
          example: 2250

    Quartier:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nom:
          type: string
          example: "Mermoz"
        commune:
          type: string
          example: "Dakar"
        zone:
          $ref: '#/components/schemas/Zone'

    TarifResponse:
      type: object
      properties:
        montant:
          type: number
          format: decimal
          example: 1500
        zone:
          type: string
        urgence:
          $ref: '#/components/schemas/TypeUrgence'
        detailCalcul:
          type: object
          properties:
            tarifBase:
              type: number
              format: decimal
            supplementPoids:
              type: number
              format: decimal
            supplementUrgence:
              type: number
              format: decimal

    # ============================================
    # ENUMS
    # ============================================
    UserRole:
      type: string
      enum:
        - VENDEUR
        - ADMIN

    StatutLivraison:
      type: string
      enum:
        - EN_ATTENTE_RAMASSAGE
        - RAMASSE
        - EN_ROUTE
        - LIVREE
        - ECHEC_ABSENT
        - ECHEC_REFUSE
        - ANNULEE

    TypeUrgence:
      type: string
      enum:
        - NORMAL
        - EXPRESS
      default: NORMAL

    # ============================================
    # ERROR SCHEMA
    # ============================================
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
