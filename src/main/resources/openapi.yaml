# ============================================
# COMPONENTS
# ============================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Token manquant ou invalide
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ForbiddenError:
      description: AccÃ¨s refusÃ© (permissions insuffisantes)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFoundError:
      description: Ressource non trouvée
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  parameters:
    LivraisonIdParam:
      name: id
      in: path
      required: true
      description: Identifiant de la livraison / commande
      schema:
        type: integer
        format: int64
    ProduitIdParam:
      name: id
      in: path
      required: true
      description: Identifiant du produit
      schema:
        type: integer
        format: int64
    MembreIdParam:
      name: id
      in: path
      required: true
      description: Identifiant du membre (closeur ou livreur)
      schema:
        type: integer
        format: int64

  schemas:
    # ============================================
    # AUTH SCHEMAS
    # ============================================
    RegisterRequest:
      type: object
      required:
        - nom
        - prenom
        - telephone
        - password
        - commune
        - quartier
        - adresseComplete
      properties:
        nom:
          type: string
          example: "Diop"
        prenom:
          type: string
          example: "Fatou"
        telephone:
          type: string
          pattern: '^(77|78|76|70|75)[0-9]{7}$'
          example: "771234567"
        email:
          type: string
          format: email
          example: "fatou@example.com"
        password:
          type: string
          format: password
          minLength: 6
        nomBoutique:
          type: string
          example: "Fatou Fashion"
        categorieActivite:
          type: string
          example: "VÃªtements"
        instagram:
          type: string
          example: "@fatoufashion"
        facebook:
          type: string
          example: "Fatou Fashion Page"
        commune:
          type: string
          example: "Dakar"
        quartier:
          type: string
          example: "SacrÃ©-Coeur"
        adresseComplete:
          type: string
          example: "Rue SC-23, Villa 45"

    LoginRequest:
      type: object
      required:
        - telephone
        - password
      properties:
        telephone:
          type: string
          example: "771234567"
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        refreshToken:
          type: string
        type:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/UserInfo'

    UserInfo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nom:
          type: string
        prenom:
          type: string
        telephone:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'
        nomBoutique:
          type: string
        statut:
          $ref: '#/components/schemas/StatutVendeur'

    # ============================================
    # LIVRAISON SCHEMAS
    # ============================================
    CreateLivraisonRequest:
      type: object
      required:
        - nomClient
        - telephoneClient
        - commune
        - quartier
        - adresseComplete
        - descriptionProduit
        - montantCOD
        - zoneId
      properties:
        telephoneVendeur:
          type: string
          pattern: '^(77|78|76|70|75)[0-9]{7}$'
          example: "771234567"
          description: "Téléphone du vendeur (requis si admin, ignoré si vendeur)"
        nomClient:
          type: string
          example: "AÃ¯ssatou Ndiaye"
        telephoneClient:
          type: string
          pattern: '^(77|78|76|70|75)[0-9]{7}$'
          example: "772345678"
        commune:
          type: string
          example: "Dakar"
        quartier:
          type: string
          example: "Mermoz"
        adresseComplete:
          type: string
          example: "CitÃ© Biagui, Villa 45"
        pointRepere:
          type: string
          example: "Face Ã  la mosquÃ©e"
        descriptionProduit:
          type: string
          example: "Ensemble wax"
        produitId:
          type: integer
          format: int64
          description: "Produit du stock lié (optionnel) - décrément auto à la livraison"
        quantite:
          type: integer
          minimum: 1
          description: "Quantité commandée du produit lié (optionnel)"
        fragile:
          type: boolean
          default: false
        poids:
          type: number
          format: double
          example: 1.5
        montantCOD:
          type: number
          format: decimal
          minimum: 1000
          maximum: 10000000
          example: 35000
        zoneId:
          type: integer
          format: int64
          example: 2
        urgence:
          $ref: '#/components/schemas/TypeUrgence'
        creneauSouhaite:
          type: string
          enum: [MATIN, APRES_MIDI, SOIR]
          example: "APRES_MIDI"
        notesPourLivreur:
          type: string
          example: "Appeler avant d'arriver"

    LivraisonResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        numeroTracking:
          type: string
          example: "DKR-00567"
        qrCodeUrl:
          type: string
          example: "https://track.votreplateforme.sn/DKR-00567/deliver"
        statut:
          $ref: '#/components/schemas/StatutLivraison'
        dateCreation:
          type: string
          format: date-time
        fraisLivraison:
          type: number
          format: decimal
